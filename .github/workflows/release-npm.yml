name: Release to npm (OIDC Trusted Publishing)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, semver (must match package.json "version"), e.g. 1.2.3 or 1.2.3-rc.1'
        required: true
        type: string

env:
  PACKAGE_NAME: "timeglass"

jobs:
  details:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$ ]]; then
            echo "::error::Invalid version '$VERSION' — expected SemVer MAJOR.MINOR.PATCH with no leading zeroes, optionally followed by a hyphen and dot-separated non-empty prerelease identifiers (e.g. 1.2.3, 1.2.3-rc.1). Rejected: 1.2.3.rc, 1.2.3-rc., 1.2.3-rc..1, 01.2.3, 1.2.3-rc.01." >&2
            exit 1
          fi

      - name: Extract Tag Name
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "tag_name=v$INPUT_VERSION" >> "$GITHUB_OUTPUT"

  check_npm:
    needs: details
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Guard against republishing an existing version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          published_version=$(npm view "$PACKAGE_NAME@$INPUT_VERSION" version 2>/dev/null || echo "none")
          echo "Published version check for $INPUT_VERSION: $published_version"
          if [ "$published_version" = "$INPUT_VERSION" ]; then
            echo "::error::version $INPUT_VERSION is already published to npm"
            exit 1
          fi

  release_gate:
    name: 1.0.0 release gate
    needs: details
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fail a 0.x to 1.0.0 release while open issues lack post-1.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          previous_version=$(npm view "$PACKAGE_NAME" versions --json 2>/dev/null | jq -r 'if type == "array" then .[] elif type == "string" then . else empty end' | sort -V | tail -n 1)
          previous_version=${previous_version:-0.0.0}
          echo "Latest version on npm: $previous_version"
          python3 bin/check_release_gate.py --new-version "$INPUT_VERSION" --previous-version "$previous_version"

  test:
    needs: [check_npm, release_gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Verify release version matches package.json
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          manifest_version=$(node -p "require('./package.json').version")
          if [ "$manifest_version" != "$INPUT_VERSION" ]; then
            echo "::error::inputs.version ($INPUT_VERSION) does not match package.json version ($manifest_version)"
            exit 1
          fi
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      - run: npm run pack:smoke

  publish:
    name: npm stage publish
    needs: [details, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: release-npm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: false

      - name: Pin npm >= 11.15.0
        run: npm install -g npm@^11.15.0

      - run: npm ci
      - run: npm run build

      - name: Stage publish
        run: npm stage publish --access public

      - name: Pack tarball for the GitHub release
        run: npm pack

      - name: Upload tarball artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: '*.tgz'

  github_release:
    name: Create GitHub Release
    needs: [details, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ needs.details.outputs.tag_name }}
    steps:
      - name: Download tarball artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: '*.tgz'
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

  docs_deploy:
    name: Deploy docs
    needs: github_release
    uses: ./.github/workflows/docs-deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
