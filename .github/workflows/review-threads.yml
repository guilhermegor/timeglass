name: Review Threads

on:
  pull_request:
  pull_request_review:
  pull_request_review_comment:
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  review-threads:
    name: Review threads answered
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name != 'issue_comment' ||
      github.event.issue.pull_request != null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml

      - name: Stage this project's review-bot roster
        run: |
          if [ -f .github/.review-bots.yaml ]; then
            cp .github/.review-bots.yaml .review-bots.yaml
          else
            echo "No .github/.review-bots.yaml — this project has opted out; the gate exits 0."
          fi

      - name: Every review thread is answered and resolved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REVIEW_THREADS_REQUIRE_RESOLVED: "1"
        run: python bin/check_review_threads.py
